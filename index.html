<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <script src="./fotogram.js" defer></script>
    <link rel="stylesheet" href="fotogram.css">
    <link rel="stylesheet" href="fonts.css">
    <link rel="shortcut icon" href="./assets/logos/fotogram-logo.png" type="image/x-icon">

</head>

<body>

    <header>

        <div class="header-container">
            <img src="./assets/logos/fotogram-header.png" alt="fotogram_logo">

        </div>

    </header>


    <main>

        <div class="main-container">

            <h1>Your personal photo album</h1>
            <div class="photo-wrapper" id="photo-box"></div>

            <dialog closedBy="any" id="dialog" class="photo-widget">

                <div class="dialog-header">
                    <p id="dialog-text"></p>

                    <button onclick="dialog.close()">
                        <img src="./assets/icons/close.png" alt="Dialog schließen">
                    </button>
                </div>

                <img id="dialog-image" src="" alt="">

                <div class="nav">
                    <button id="prev-button" onclick="previousPhoto()"><img src="./assets/icons/Arrow-Right.png" alt="previous_picture"></button>
                    <p id="image-counter"></p>
                    <button id="next-button" onclick="nextPhoto()"><img src="./assets/icons/Arrow-Right.png" alt="next_picture"></button>
                </div>

            </dialog>
    </main>


    <footer>

        <div class="footer-container">

            <img src="./assets/logos/developer-logo.png" alt="developer-akademie-logo">
            <p>© 2026 Developer Akademie GmbH</p>

        </div>

    </footer>

</body>

</html>
